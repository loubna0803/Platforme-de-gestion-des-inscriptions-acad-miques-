server:
  port: 8084

spring:
  application:
    name: inscription-service
  datasource:
    url: jdbc:mysql://localhost:3306/inscription_db
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      studentService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      moduleService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
