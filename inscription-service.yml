server:
  port: 8084

spring:
  application:
    name: inscription-service
  datasource:
    url: jdbc:h2:mem:moduledb
    driverClassName: org.h2.Driver
    username: sa
    password:
    platform: h2
  h2:
    console:
      enabled: true
  # datasource:
  #   url: jdbc:mysql://localhost:3306/inscription_db
  #   username: root
  #   password:
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      studentService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      moduleService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
