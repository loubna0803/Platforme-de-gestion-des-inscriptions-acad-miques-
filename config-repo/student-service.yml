server:
  port: 8081
  
spring:
  application:
    name: student-service
  # config:
  #   import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:mysql://localhost:3306/studentdb
    username: root
    password: root123
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true   #le service s’enregistre automatiquement
    fetch-registry: true   #le service peut voir les autres services sur Eureka





