  datasource:
    url: jdbc:h2:mem:moduledb
    driverClassName: org.h2.Driver
    username: sa
    password:
    platform: h2
  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true   #le service s’enregistre automatiquement
    fetch-registry: true   #le service peut voir les autres services sur Eureka

