server:
  port: 8083

spring:
  application:
    name: formation-service

  datasource:
    url: jdbc:mysql://localhost:3306/formationdb
    username: root
    password: 123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  cloud:
    config:
      enabled: false

